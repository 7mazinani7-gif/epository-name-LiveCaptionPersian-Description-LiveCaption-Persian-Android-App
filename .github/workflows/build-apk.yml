name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LiveCaptionPersian-v0.9.4-ONE-FILE-PACKAGE.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="LiveCaptionPersian-v0.9.4-ONE-FILE-PACKAGE.zip"

          test -f "$PACKAGE"

          cp "$PACKAGE" /tmp/livecaption.zip

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' -exec rm -rf {} +

          unzip -q /tmp/livecaption.zip -d .

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          grep -F 'versionCode = 12' app/build.gradle.kts
          grep -F 'versionName = "0.9.4"' app/build.gradle.kts

          echo "Project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionPersian-v0.9.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
